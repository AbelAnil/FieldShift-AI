version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fieldshift-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FieldShift AI Backend
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DEFAULT_REGION=Kerala, India
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # No reverse proxy in this dev stack, so point the browser at the backend port directly.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: fieldshift-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
